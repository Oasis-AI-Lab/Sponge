# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@oasisailab/sponge-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@oasisailab/sponge-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@oasisailab/sponge-subprocess-local'

- id: terminal
  name: '@oasisailab/sponge-terminal'

- id: terminal-pwsh
  name: '@oasisailab/sponge-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@oasisailab/sponge-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@oasisailab/sponge-tool-pwsh-persistent'
